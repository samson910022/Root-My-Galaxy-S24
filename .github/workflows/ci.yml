name: CI Build

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: CI Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      # The platform is versioned by minor now, so the package is android-37.0
      # rather than android-37. Installing the wrong one only works by relying
      # on AGP's auto-download, which hides the real requirement. The NDK is
      # pinned to the version app/build.gradle.kts declares, because the
      # vendored helper binary is built with it and the two must agree.
      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0 cmake;3.22.1 ndk;28.2.13676358'
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      # The two vendored binaries are not compiled by Gradle, so they are
      # checked explicitly: the helper against its recorded provenance, and the
      # payload against the digest in the bundled manifest.
      - name: Verify the vendored binaries
        run: |
          ./tools/build-helper.sh --check
          ./tools/sync-payloads.sh --check

      # The instrumented suite is compiled but not run: one of its tests
      # launches the exploit and needs the real device.
      - name: Build debug APK and run unit tests
        run: ./gradlew testDebugUnitTest compileDebugAndroidTestKotlin assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
