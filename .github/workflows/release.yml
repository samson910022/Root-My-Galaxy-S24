name: Release Build

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: Release tag to publish, or leave blank to derive it as v plus versionName
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Publishing is not a check: let an in-flight release finish rather than
  # cancelling it midway through tagging and uploading.
  cancel-in-progress: false

jobs:
  build:
    name: Release Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
          check-latest: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.0.0 cmake;3.22.1 ndk;28.2.13676358'
          accept-android-sdk-licenses: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Resolve release tag
        id: release_tag
        shell: bash
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail

          git fetch --tags --force
          VERSION_NAME="$(grep -oE 'versionName[[:space:]]*=[[:space:]]*"[^"]+"' app/build.gradle.kts | head -n 1 | cut -d'"' -f2)"
          EXPECTED_TAG="v$VERSION_NAME"

          if [ -n "$INPUT_TAG_NAME" ]; then
            TAG_NAME="$INPUT_TAG_NAME"
          else
            TAG_NAME="$EXPECTED_TAG"
          fi

          if [ -z "$TAG_NAME" ]; then
            echo "No release tag found." >&2
            exit 1
          fi

          if [ "$TAG_NAME" != "$EXPECTED_TAG" ]; then
            echo "Tag $TAG_NAME does not match app version $VERSION_NAME (expected $EXPECTED_TAG)." >&2
            exit 1
          fi

          # An existing tag must point at the commit being released. Reusing a
          # tag left behind by a failed run would otherwise republish whatever
          # that run happened to check out.
          HEAD_COMMIT="$(git rev-parse HEAD)"
          if git rev-parse -q --verify "refs/tags/$TAG_NAME" >/dev/null; then
            EXISTING="$(git rev-list -n 1 "$TAG_NAME")"
            if [ "$EXISTING" != "$HEAD_COMMIT" ]; then
              echo "Tag $TAG_NAME points at $EXISTING but this run is $HEAD_COMMIT." >&2
              echo "Delete the tag or release from the commit it names." >&2
              exit 1
            fi
            TAG_EXISTS=true
          else
            TAG_EXISTS=false
          fi

          # Only this fork's tags count: every other v* tag here came from
          # upstream, and diffing against one would misreport the release.
          PREVIOUS_TAG="$(git tag --list 'v*-s24.*' --sort=-v:refname | grep -Fxv "$TAG_NAME" | head -n 1 || true)"

          {
            echo "tag_name=$TAG_NAME"
            echo "version_name=$VERSION_NAME"
            echo "tag_commit=$HEAD_COMMIT"
            echo "previous_tag=$PREVIOUS_TAG"
            echo "tag_exists=$TAG_EXISTS"
          } >> "$GITHUB_OUTPUT"

      # The two vendored binaries are not compiled by Gradle, so they are
      # checked explicitly: the helper against its recorded provenance, and the
      # payload against the digest in the bundled manifest.
      - name: Verify the vendored binaries
        run: |
          ./tools/build-helper.sh --check
          ./tools/sync-payloads.sh --check

      # Restore the signing material from repository secrets into RUNNER_TEMP
      # so the keystore never touches the workspace. Nothing here is echoed.
      - name: Write signing material
        shell: bash
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077

          KEYSTORE_PATH="$RUNNER_TEMP/release.p12"
          PASSWORD_PATH="$RUNNER_TEMP/release-password.txt"

          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          [ -s "$KEYSTORE_PATH" ] || {
            echo "RELEASE_KEYSTORE_BASE64 did not decode to a non-empty keystore" >&2
            exit 1
          }

          printf '%s' "$RELEASE_KEYSTORE_PASSWORD" > "$PASSWORD_PATH"
          chmod 600 "$PASSWORD_PATH"
          [ -s "$PASSWORD_PATH" ] || {
            echo "RELEASE_KEYSTORE_PASSWORD is empty" >&2
            exit 1
          }

      - name: Build signed release APK and run unit tests
        shell: bash
        env:
          RELEASE_KEYSTORE: ${{ runner.temp }}/release.p12
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEYSTORE_PASSWORD_FILE: ${{ runner.temp }}/release-password.txt
          RELEASE_CERT_SHA256: ${{ secrets.RELEASE_CERT_SHA256 }}
        run: |
          set -euo pipefail
          ./gradlew testDebugUnitTest --no-daemon
          ./tools/release-apk.sh

      # Deliberately after the build: a tag is what a release is cut from, so
      # it must not exist unless the build it names actually succeeded.
      - name: Create the release tag
        shell: bash
        env:
          TAG_NAME: ${{ steps.release_tag.outputs.tag_name }}
          TAG_EXISTS: ${{ steps.release_tag.outputs.tag_exists }}
        run: |
          set -euo pipefail
          if [ "$TAG_EXISTS" = "true" ]; then
            echo "Tag $TAG_NAME already exists at the right commit; reusing it."
            exit 0
          fi
          git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
          git push origin "refs/tags/$TAG_NAME"

      - name: Generate release notes
        shell: bash
        env:
          TAG_NAME: ${{ steps.release_tag.outputs.tag_name }}
          VERSION_NAME: ${{ steps.release_tag.outputs.version_name }}
          TAG_COMMIT: ${{ steps.release_tag.outputs.tag_commit }}
          PREVIOUS_TAG: ${{ steps.release_tag.outputs.previous_tag }}
        run: |
          set -euo pipefail

          {
            echo "# Release $TAG_NAME"
            echo
            echo "Version: $VERSION_NAME"
            echo "Commit: $TAG_COMMIT"
            echo
            if [ -n "$PREVIOUS_TAG" ]; then
              echo "Changes since $PREVIOUS_TAG:"
              echo
              git log --format='- %s' "$PREVIOUS_TAG..$TAG_NAME"
            else
              echo "First tagged release."
            fi
          } > release-notes.md

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.release_tag.outputs.tag_name }}
          VERSION_NAME: ${{ steps.release_tag.outputs.version_name }}
        run: |
          set -euo pipefail

          APK_PATH="app/build/outputs/apk/release/roots24-${VERSION_NAME}.apk"
          [ -f "$APK_PATH" ] || {
            echo "signed release APK not found: $APK_PATH" >&2
            exit 1
          }

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" \
              --title "Release $TAG_NAME" \
              --notes-file release-notes.md \
              --latest
            gh release upload "$TAG_NAME" "$APK_PATH" --clobber
          else
            gh release create "$TAG_NAME" "$APK_PATH" \
              --title "Release $TAG_NAME" \
              --notes-file release-notes.md \
              --latest
          fi